- name: Provision Fabric Devices
  hosts: podX_dnac
  connection: local
  gather_facts: false
  vars:
    site_name: "Global/Poland/Warszawa/Hector"
    pod: X

  vars_files:
    - ip_pool_data.yaml

  roles:
    - get_info
    - role: pause
      message: "display gathered information"
    - display_info
    - role: pause
      message: "assign credentials"
    - assign_credentials
    - role: pause
      message: "Reserve IP sub-pools"
    - reserve_ip_pools
