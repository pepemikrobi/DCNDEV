---
# tasks file for roles/sda_prepare_data

# Retrieve fabric sites

- name: Print fabric site ID
  ansible.builtin.debug:
    msg: "Fabric site id we're working with: {{ fabric_site_id }}"

- name: Get all SDA Fabric sites count info
  cisco.dnac.sda_fabric_sites_count_info:
    dnac_host: "{{ dnac_host }}"
    dnac_verify: "{{ dnac_verify }}"
  register: sda_fabric_sites_count_info

- name: Display SDA Fabric Sites Count Info
  ansible.builtin.debug:
    msg: "Fabric sites configured: {{ sda_fabric_sites_count_info.dnac_response.response.count }}"

# (debug) Display devices IPs and IDs

- name: Display key-value pair of IPs and IDs
  ansible.builtin.debug:
    msg: "IP {{ item.ip }}, ID {{ item.id }}"
  vars:
    devices_id: "{{ device_list | json_query('[*].{ip: managementIpAddress, id: id}') }}"
  loop: "{{ devices_id }}"
  loop_control:
    label: "Device"

# - name: Raw print fabric devices
#   ansible.builtin.debug:
#     msg: "{{ fabric_devices }}"

# Create data structure for fabric devices

- name: Create fabric config
  ansible.builtin.set_fact:
    fabric_device_data: |
      {{
        fabric_device_data | default([]) +
        [
          _dev | selectattr('mgmt_ip', 'equalto', item)
          | map ('combine', fabric_config | selectattr('mgmt_ip', 'equalto', item) | json_query('[*].{roles: roles}'))
          | first
        ]
      }}
  vars:
    _dev: "{{ device_list | json_query('[*].{mgmt_ip: managementIpAddress, dev_id: id}') }}"
  loop: "{{ fabric_config | json_query('[*].mgmt_ip') }}"
  loop_control:
    label: "Set for device {{ item }}"

- name: Print fabric device data
  ansible.builtin.debug:
    msg: "{{ item }}"
  loop: "{{ fabric_device_data }}"

# Get configured SDA Fabric ID

- name: Get SDA Fabric Site data
  cisco.dnac.sda_fabric_sites_info:
    dnac_host: "{{ dnac_host }}"
    dnac_verify: "{{ dnac_verify }}"
    siteId: "{{ fabric_site_id }}"
  register: get_sda_fabric_result

- name: Get SDA Fabric Site ID
  ansible.builtin.set_fact:
    sda_site_id: "{{ get_sda_fabric_result.dnac_response.response[0].id }}"

- name: Display SDA Fabric Site ID
  ansible.builtin.debug:
    msg: "SDA Fabric Site ID: {{ sda_site_id }}"
