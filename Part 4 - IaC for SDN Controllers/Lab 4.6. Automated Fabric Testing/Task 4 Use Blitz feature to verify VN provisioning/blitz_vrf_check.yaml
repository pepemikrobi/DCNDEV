# pyATS Blitz test – verify VN1 and VN2 are present as VRFs on all fabric devices

VrfCheck:
  source:
    pkg: genie.libs.sdk
    class: triggers.blitz.blitz.Blitz
  devices:
    - POD5_R1
    - POD5_R2
    - POD5_SW1
    - POD5_SW2

  test_sections:
    - verify_vrfs:
        - loop:
            loop_variable_name: device_name
            value:
              - POD5_R1
              - POD5_R2
              - POD5_SW1
              - POD5_SW2
            actions:
              - parse:
                  device: "%VARIABLES{device_name}"
                  command: show vrf
                  include:
                    - raw("[vrf][VN1]")
                    - raw("[vrf][VN2]")
                    - raw("[vrf][VN3]")                    
